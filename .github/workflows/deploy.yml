name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# the deploy needs to mint an id token for Pages. nothing here writes to
# the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, and let a running one finish rather than shipping
# a half published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python3 tools/build.py

      - name: Check
        run: python3 tools/check.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
