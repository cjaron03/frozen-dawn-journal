<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html { height:100%; }
  body {
    min-height:100%;
    background:#0f1216;
    color:#d4dade;
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* site bar. deliberately quiet: the pages below carry the design. */
  .sb {
    position:sticky; top:0; z-index:9000;
    display:flex; align-items:center; gap:22px;
    padding:0 22px; height:46px;
    background:#0d1116; border-bottom:1px solid #1a212a;
  }
  .sb-brand {
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:#7dd3fc; text-decoration:none; white-space:nowrap; flex-shrink:0;
  }
  .sb-brand span { color:#5a6672; }
  .sb-nav {
    --f0:0px; --f1:0px;
    display:flex; align-items:center; gap:18px;
    overflow-x:auto; overscroll-behavior-x:contain; min-width:0;
    scrollbar-width:none; -ms-overflow-style:none;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--f0),
                       #000 calc(100% - var(--f1)),transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 var(--f0),
                       #000 calc(100% - var(--f1)),transparent 100%);
  }
  .sb-nav::-webkit-scrollbar { display:none; }
  /* the native bar is hidden, so the bar draws its own, and only when
     there is actually something off the edge. */
  .sb-rail { position:absolute; bottom:0; height:2px; display:none;
             pointer-events:none; left:var(--nx,0px); width:var(--nw,0px); }
  .sb-nav.can ~ .sb-rail { display:block; }
  .sb-rail i { display:block; height:100%; border-radius:2px;
               background:#33404c; width:var(--tw,0px);
               transform:translateX(var(--tx,0px)); }
  .sb-nav.drag ~ .sb-rail i { background:#5f6b76; }
  /* every other strip that runs off the edge gets the same rail. it rides the
     top edge of the bar, because the bottom edge already belongs to the
     active tab underline. */
  .fd-rail { position:absolute; top:0; height:2px; display:none; z-index:2;
             pointer-events:none; left:var(--nx,0px); width:var(--nw,0px); }
  .fd-rail.on { display:block; }
  .fd-rail i { display:block; height:100%; border-radius:2px;
               background:#33404c; width:var(--tw,0px);
               transform:translateX(var(--tx,0px)); }
  /* a wide table is the other thing that runs off the edge of a phone. it
     hides its native bar the same way and the rail rides the bottom, because
     the top edge of a table is its header row. */
  .fd-xw { position:relative; }
  /* the drawn rail hangs just below the box, so it needs a little room
     under it. it only exists when the box actually scrolls, so the room
     only appears then too, and nothing gains a gap at desk width. */
  .fd-xw:has(.fd-rail.on) { margin-bottom:15px; }
  /* just below the table, not on its bottom border, where it would read as a
     rule rather than as something that moves. */
  .fd-rail.b { top:auto; bottom:-4px; }
  .fd-x { scrollbar-width:none; -ms-overflow-style:none; }
  .fd-x::-webkit-scrollbar { display:none; }
  .sb-nav.can { cursor:grab; }
  .sb-nav.can.drag { cursor:grabbing; }
  .sb-nav.drag a { pointer-events:none; }
  .sb-nav a {
    font-size:12px; color:#96a1aa; text-decoration:none; white-space:nowrap;
    padding:3px 0; border-bottom:1px solid transparent; transition:color .15s linear;
  }
  .sb-nav a:hover { color:#d4dade; }
  .sb-nav a.on { color:#7dd3fc; border-bottom-color:#7dd3fc; }
  .sb-nav a.soon { color:#4a545e; pointer-events:none; }
  .sb-page { padding:2rem; }

  /* the homepage has its own masthead and nav, so the shared bar is dropped there. */
  body.home .sb { display:none; }

  /* the replay and swap controls float in the gutter beside the reading
     column. below about 870px the gutter is narrower than the control, so
     it lands on the words instead. the controls belong to the moment the
     intro ends, so they step aside as soon as you start reading and come
     back when you scroll to the top again. */
  @media (max-width:900px) {
    .ap-tools, .ap-replay { transition:opacity .2s linear; }
    .ap-frame.read .ap-tools, .ap-frame.read .ap-replay {
      opacity:0; pointer-events:none;
    }
  }

  @media (max-width:640px) {
    .sb { gap:12px; padding:0 12px; }
    .sb-nav { gap:15px; }
    .sb-page { padding:1rem; }
    .sb-brand { font-size:10px; letter-spacing:.1em; }
    .sb-brand span { display:none; }
  }
</style>
</head>
<body class="__BODYCLASS__">
<nav class="sb">
  <a class="sb-brand" href="index.html">Frozen&nbsp;Dawn <span>/ dev journal</span></a>
  <div class="sb-nav">__NAV__</div>
  <div class="sb-rail" aria-hidden="true"><i></i></div>
</nav>
<div class="sb-page">
__BODY__
</div>

<script>
/* the chapter bar runs wider than the window on most screens. drag it with
   the mouse, or roll a wheel over it, or swipe it on a phone. */
(function () {
  var nav = document.querySelector('.sb-nav');
  if (!nav) return;

  var FADE = 22, down = false, moved = false, x0 = 0, s0 = 0, pid = -1;

  function room() { return nav.scrollWidth - nav.clientWidth; }

  var rail = document.querySelector('.sb-rail');

  function edges() {
    var max = room();
    nav.classList.toggle('can', max > 4);
    nav.style.setProperty('--f0', (nav.scrollLeft > 4 ? FADE : 0) + 'px');
    nav.style.setProperty('--f1', (nav.scrollLeft < max - 4 ? FADE : 0) + 'px');
    if (!rail) return;
    if (max <= 4) return;
    var w  = nav.clientWidth,
        tw = Math.max(22, Math.round(w * w / nav.scrollWidth));
    rail.style.setProperty('--nx', nav.offsetLeft + 'px');
    rail.style.setProperty('--nw', w + 'px');
    rail.style.setProperty('--tw', tw + 'px');
    rail.style.setProperty('--tx',
      Math.round((w - tw) * Math.min(1, Math.max(0, nav.scrollLeft / max))) + 'px');
  }

  nav.addEventListener('scroll', edges, { passive: true });
  window.addEventListener('resize', edges);

  nav.addEventListener('wheel', function (e) {
    var max = room();
    if (max <= 4) return;
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!d) return;
    /* hand the page back its scroll once the bar has nowhere left to go. */
    if ((d < 0 && nav.scrollLeft <= 0) || (d > 0 && nav.scrollLeft >= max)) return;
    e.preventDefault();
    nav.scrollLeft += d;
  }, { passive: false });

  /* touch already pans natively. this is for the mouse. */
  nav.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'touch' || e.button || room() <= 4) return;
    down = true; moved = false; x0 = e.clientX; s0 = nav.scrollLeft; pid = e.pointerId;
  });

  /* the pointer is deliberately not captured on the way down. a captured
     pointer sends its own pointerup to the bar instead of to whatever is
     under it, which drags the click off the link you pressed and onto the
     bar, and then the link never opens. the capture is taken on the first
     real drag, which is the only moment it is needed for. */
  window.addEventListener('pointermove', function (e) {
    if (!down || e.pointerId !== pid) return;
    var dx = e.clientX - x0;
    if (!moved && Math.abs(dx) > 3) {
      moved = true;
      nav.classList.add('drag');
      try { nav.setPointerCapture(pid); } catch (err) {}
    }
    if (moved) nav.scrollLeft = s0 - dx;
  });

  function release(e) {
    if (!down || e.pointerId !== pid) return;
    down = false;
    nav.classList.remove('drag');
    try { nav.releasePointerCapture(pid); } catch (err) {}
    if (moved) setTimeout(function () { moved = false; }, 0);
  }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  /* a drag that ends on a link must not also follow it. */
  nav.addEventListener('click', function (e) {
    if (moved) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  /* open on the chapter you are actually reading. measured off rects, because
     the bar is sticky and every link's offsetParent is the bar, not the strip. */
  var on = nav.querySelector('a.on');
  if (on) {
    var nr = nav.getBoundingClientRect(), r = on.getBoundingClientRect();
    nav.scrollLeft += (r.left - nr.left) - (nr.width - r.width) / 2;
  }
  edges();
})();
</script>

<script>
/* the chapter tab strips and the wide tables are cut off on a phone the same
   way the bar is, and they hide their native scrollbar too, so they get the
   same drawn one. */
(function () {
  var strips = document.querySelectorAll('.ap-dstrip, .fd-x');
  for (var i = 0; i < strips.length; i++) attach(strips[i]);

  function attach(strip) {
    var host = strip.parentNode;
    if (!host) return;
    /* a tab strip already sits inside a positioned deck. a table does not, so
       it gets a wrapper of its own for the rail to hang from. */
    var low = strip.className.indexOf('fd-x') > -1;
    if (low) {
      var wrap = document.createElement('div');
      wrap.className = 'fd-xw';
      host.insertBefore(wrap, strip);
      wrap.appendChild(strip);
      host = wrap;
    }
    var rail = document.createElement('div');
    rail.className = low ? 'fd-rail b' : 'fd-rail';
    rail.setAttribute('aria-hidden', 'true');
    rail.appendChild(document.createElement('i'));
    host.appendChild(rail);

    function edges() {
      var w   = strip.clientWidth,
          max = strip.scrollWidth - w;
      rail.classList.toggle('on', max > 4 && w > 0);
      if (max <= 4 || !w) return;
      var tw = Math.max(22, Math.round(w * w / strip.scrollWidth));
      rail.style.setProperty('--nx', strip.offsetLeft + 'px');
      rail.style.setProperty('--nw', w + 'px');
      rail.style.setProperty('--tw', tw + 'px');
      rail.style.setProperty('--tx',
        Math.round((w - tw) * Math.min(1, Math.max(0, strip.scrollLeft / max))) + 'px');
    }

    strip.addEventListener('scroll', edges, { passive: true });
    window.addEventListener('resize', edges);
    /* the deck is usually still behind the intro when this runs. */
    if (window.ResizeObserver) new ResizeObserver(edges).observe(strip);
    else { setTimeout(edges, 600); setTimeout(edges, 2400); setTimeout(edges, 6000); }
    edges();
  }
})();
</script>

<script>
/* the chapter pages float their replay and swap controls in the corner of the
   frame. on a phone that corner is on top of the words, so the controls step
   aside the moment the reader moves off the opening screen, which is the only
   place replaying the intro means anything. the CSS decides at what width it
   matters: this only says whether you are reading yet. */
(function () {
  var frame = document.querySelector('.ap-frame');
  if (!frame) return;
  var doc = frame.querySelector('.ap-doc');
  if (!doc) return;
  doc.addEventListener('scroll', function () {
    var read = doc.scrollTop > 48;
    if (read !== frame.classList.contains('read')) frame.classList.toggle('read', read);
  }, { passive: true });
})();
</script>
</body>
</html>
